<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Form Example</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container mt-5 mb-5">
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0">Payment form example</h5>
            </div>
            <div class="card-body">
                <!-- Alert Message -->
                <div class="alert alert-danger"  role="alert" id="form-alert">
                    Some fields are missing
                </div>

                <!-- Form Start -->
                <form id="payment-form" class="needs-validation" novalidate>
                    <div class="row g-3 mb-3">
                        <!-- Card Number -->
                        <div class="col-md-5">
                            <label for="card-number" class="form-label">Card #</label>
                            <!-- Note: Using value as per image, though placeholder is more typical -->
                            <input type="text" class="form-control" id="card-number" value="XXXXXXXXXXXXXX" required pattern="\d{13,16}" title="Enter a valid 13 to 16 digit card number">
                             <div class="invalid-feedback">
                                Please enter a valid card number.
                            </div>
                        </div>
                        <!-- CVC -->
                        <div class="col-md-3">
                            <label for="cvc" class="form-label">CVC #</label>
                             <!-- Note: Using value as per image, though placeholder is more typical -->
                            <input type="text" class="form-control" id="cvc" value="0000" required pattern="\d{3,4}" maxlength="4" title="Enter 3 or 4 digit CVC">
                             <div class="invalid-feedback">
                                Please enter a valid CVC.
                            </div>
                        </div>
                        <!-- Amount -->
                        <div class="col-md-4">
                            <label for="amount" class="form-label">Amount</label>
                            <div class="input-group">
                                <span class="input-group-text">$</span>
                                <input type="number" class="form-control" id="amount" placeholder="Amount" required min="0.01" step="0.01">
                                <div class="invalid-feedback">
                                    Please enter a valid amount.
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="row g-3 mb-3">
                        <!-- First Name -->
                        <div class="col-md-6">
                            <label for="first-name" class="form-label">First Name</label>
                            <input type="text" class="form-control" id="first-name" required>
                            <div class="invalid-feedback">
                                First name is required.
                            </div>
                        </div>
                        <!-- Last Name -->
                        <div class="col-md-6">
                            <label for="last-name" class="form-label">Last Name</label>
                            <input type="text" class="form-control" id="last-name" required>
                             <div class="invalid-feedback">
                                Last name is required.
                            </div>
                        </div>
                    </div>

                    <div class="row g-3 mb-3">
                        <!-- City -->
                        <div class="col-md-5">
                            <label for="city" class="form-label">City</label>
                            <input type="text" class="form-control" id="city" required>
                             <div class="invalid-feedback">
                                City is required.
                            </div>
                        </div>
                        <!-- State -->
                        <div class="col-md-4">
                            <label for="state" class="form-label">State</label>
                            <select class="form-select" id="state" required>
                                <option selected disabled value="">Pick a state</option>
                                <option value="AL">Alabama</option>
                                <option value="AK">Alaska</option>
                                <option value="CA">California</option>
                                <option value="TX">Texas</option>
                                <!-- Add other states as needed -->
                            </select>
                             <div class="invalid-feedback">
                                Please select a state.
                            </div>
                        </div>
                        <!-- Postal Code -->
                        <div class="col-md-3">
                            <label for="postal-code" class="form-label">Postal Code</label>
                            <input type="text" class="form-control" id="postal-code" required pattern="\d{5}(-\d{4})?" title="Enter 5 digit or 5+4 digit ZIP code">
                             <div class="invalid-feedback">
                                Please enter a valid postal code.
                            </div>
                        </div>
                    </div>

                    <div class="row g-3">
                         <!-- We Accept -->
                        <div class="col-md-6 mb-3">
                             <label class="form-label d-block">We accept:</label> <!-- d-block to ensure it takes space -->
                             <div class="bg-secondary rounded p-1 d-inline-block" id="card-icons">
                                 <div class="card-icon"></div>
                                 <div class="card-icon">V</div>
                                 <div class="card-icon">M</div>
                                 <div class="card-icon">Am</div>
                             </div>
                        </div>
                         <!-- Message -->
                        <div class="col-md-6 mb-3">
                             <label for="message" class="form-label">Message</label>
                             <textarea class="form-control" id="message" rows="3"></textarea>
                             <div id="messageHelp" class="form-text">Add any notes here.</div>
                        </div>
                    </div>
                </form>
                <!-- Form End -->
            </div>
            <div class="card-footer text-end bg-light">
                <button type="button" class="btn btn-secondary">Cancel</button>
                <button type="submit" class="btn btn-primary" form="payment-form">Send</button> <!-- Link button to form -->
            </div>
        </div>
    </div>

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
    <!-- Custom JS for Validation -->
    <script src="script.js"></script>
</body>
</html>
